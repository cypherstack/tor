name: tor_ffi_plugin
description: Tor FFI plugin for Dart and Flutter.  Uses Arti (A Rust Tor Implementation) via FFI.
version: 0.2.0
homepage: https://github.com/cypherstack/tor

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1
  code_assets: ^1.2.1
  hooks: ^2.0.2
  meta: ^1.16.0
  dnix:
    git:
      url: https://github.com/cypherstack/dnix.git
      ref: e91763ef25d084b3a5cf271a0cfee69159b1f779

dev_dependencies:
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
