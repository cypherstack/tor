name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      # The hook builds through the Nix flake; before the first native
      # release that is the only path, and it is unavailable on Windows.
      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.os != 'Windows'
      - run: flutter pub get
      - run: dart analyze hook tool test
      # Prebuilt libraries exist once the lock's release is published from the
      # default branch of the repository dnix.json names; until then only
      # hosts with Nix can build them.
      - name: Check whether the lock's release is published
        id: release
        shell: bash
        run: |
          repository=$(jq -r .repository dnix.json | sed 's/\.git$//; s#/$##')
          tag="native-$(jq -r .release dnix.lock)"
          echo "published=$([ "$(curl -s -o /dev/null -w '%{http_code}' "$repository/releases/tag/$tag")" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Choose the build mode
        shell: bash
        run: echo '${{ steps.release.outputs.published == 'true' && 'prebuilt' || 'source' }}' > .dnix-build
      - name: Run flutter test
        if: runner.os != 'Windows' || steps.release.outputs.published == 'true'
        shell: bash
        run: |
          if ! flutter test 2>&1 | tee test.log; then
            echo "::error::$(tail -c 1500 test.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Test example widgets
        if: runner.os == 'Linux' && runner.arch == 'X64'
        working-directory: example
        run: flutter test

  # The crate's own checks, as before the native library moved to dnix.
  rust:
    name: Rust tests, lints, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl
      - name: Install pinned Rust toolchain
        run: bash tool/ci/install_rust.sh --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify Rust
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --locked --all-targets --manifest-path rust/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: |
          cargo audit --file rust/Cargo.lock \
            --deny unsound \
            --deny yanked \
            --ignore RUSTSEC-2021-0145 \
            --ignore RUSTSEC-2023-0071

  windows-tests:
    if: github.event_name == 'pull_request'
    name: Windows time, IPv6, and file release tests
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NATIVE_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use short Windows build paths
        shell: pwsh
        run: ./tool/ci/windows_paths.ps1
      - name: Install pinned Rust toolchain
        run: bash tool/ci/install_rust.sh --target "$NATIVE_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: windows-tests
          cache-targets: false
      - name: Test time limits, IPv6 fallback, and file release
        run: bash tool/ci/test_windows.sh

