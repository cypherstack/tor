name: Native and package validation

on:
  pull_request:
  push:
    tags: ['native-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-prebuilts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Rust, Dart, and lifecycle tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev liblzma-dev ninja-build pkg-config perl
      - name: Install pinned Rust toolchain
        run: bash tool/ci/install_rust.sh --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Verify Rust
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --locked --all-targets --manifest-path rust/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - name: Verify Dart and native lifecycle
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Test example widgets
        working-directory: example
        run: flutter test
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: |
          cargo audit --file rust/Cargo.lock \
            --deny unsound \
            --deny yanked \
            --ignore RUSTSEC-2021-0145 \
            --ignore RUSTSEC-2023-0071

  windows-tests:
    if: github.event_name == 'pull_request'
    name: Windows time, IPv6, and file release tests
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NATIVE_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Use short Windows build paths
        shell: pwsh
        run: ./tool/ci/windows_paths.ps1
      - name: Install pinned Rust toolchain
        run: bash tool/ci/install_rust.sh --target "$NATIVE_TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: windows-tests
          cache-targets: false
      - name: Test time limits, IPv6 fallback, and file release
        run: bash tool/ci/test_windows.sh

  build:
    if: github.event_name != 'pull_request' && github.event.deleted != true
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {target: x86_64-pc-windows-msvc, runner: windows-2022}
          - {target: aarch64-apple-darwin, runner: macos-15}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: aarch64-apple-ios, runner: macos-15}
          - {target: aarch64-apple-ios-sim, runner: macos-15}
          - {target: x86_64-apple-ios, runner: macos-15-intel}
          - {target: armv7-linux-androideabi, runner: ubuntu-22.04}
          - {target: aarch64-linux-android, runner: ubuntu-22.04}
          - {target: x86_64-linux-android, runner: ubuntu-22.04}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Use short Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/ci/windows_paths.ps1
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl
      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: bash tool/ci/install_rust.sh --target "$NATIVE_TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
          # Windows output lives outside the workspace; cache its downloads only.
          cache-targets: ${{ runner.os != 'Windows' }}
      - name: Build and package
        run: |
          case "$NATIVE_TARGET" in
            *android*)
              ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              export PATH="$ndk_bin:$PATH"
              key=${NATIVE_TARGET//-/_}
              clang_target=${NATIVE_TARGET/armv7-/armv7a-}
              export "CC_$key=$ndk_bin/${clang_target}24-clang"
              export "CXX_$key=$ndk_bin/${clang_target}24-clang++"
              export "AR_$key=$ndk_bin/llvm-ar"
              export "RANLIB_$key=$ndk_bin/llvm-ranlib"
              export "CARGO_TARGET_$(echo "$key" | tr '[:lower:]' '[:upper:]')_LINKER=$ndk_bin/${clang_target}24-clang"
              export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'
              ;;
            *apple*)
              export RUSTFLAGS='-C link-arg=-Wl,-install_name,@rpath/libtor_ffi_plugin.dylib'
              case "$NATIVE_TARGET" in
                aarch64-apple-ios) SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path) ;;
                *-ios*) SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path) ;;
              esac
              export SDKROOT
              ;;
          esac
          cargo build --locked --release --lib --manifest-path rust/Cargo.toml \
            --target "$NATIVE_TARGET"
          case "$NATIVE_TARGET" in
            *windows*) library=tor_ffi_plugin.dll ;;
            *apple*) library=libtor_ffi_plugin.dylib ;;
            *) library=libtor_ffi_plugin.so ;;
          esac
          mkdir -p artifacts
          cp "$CARGO_TARGET_DIR/$NATIVE_TARGET/release/$library" "artifacts/$NATIVE_TARGET-$library"
      - name: Test time limits, IPv6 fallback, and file release
        if: runner.os == 'Windows'
        run: bash tool/ci/test_windows.sh
      - name: Smoke test desktop library
        if: ${{ !contains(matrix.target, 'android') && !contains(matrix.target, '-ios') }}
        run: python tool/ci/smoke_native.py artifacts/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuilt-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  package:
    if: github.event_name == 'pull_request'
    name: Package example (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, runner: ubuntu-22.04}
          - {platform: android, runner: ubuntu-22.04}
          - {platform: ios, runner: macos-15}
          - {platform: macos, runner: macos-15}
          - {platform: windows, runner: windows-2022}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config perl
      - name: Install Android Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: |
          case "${{ matrix.platform }}" in
            linux) target=x86_64-unknown-linux-gnu ;;
            android) target=aarch64-linux-android ;;
            ios) target=aarch64-apple-ios ;;
            # flutter build macos is universal, so the hook also builds x86_64.
            macos) target=aarch64-apple-darwin,x86_64-apple-darwin ;;
            windows) target=x86_64-pc-windows-msvc ;;
          esac
          bash tool/ci/install_rust.sh --target "$target"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: package-${{ matrix.platform }}
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Build packaged example
        working-directory: example
        run: |
          case "${{ matrix.platform }}" in
            linux) flutter build linux --release ;;
            android) flutter build apk --release --target-platform android-arm64 ;;
            ios) flutter build ios --release --no-codesign ;;
            macos) flutter build macos --release ;;
            windows) flutter build windows --release ;;
          esac
      - name: Load packaged macOS library
        if: matrix.platform == 'macos'
        run: bash tool/ci/check_macos_app.sh
      - name: Load packaged Windows library
        if: matrix.platform == 'windows'
        run: python tool/ci/smoke_native.py example/build/windows/x64/runner/Release/tor_ffi_plugin.dll

  release:
    if: github.event_name != 'pull_request' && github.event.deleted != true
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prebuilt-*
          path: artifacts
          merge-multiple: true
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - name: Generate manifest
        run: dart --packages=.dart_tool/package_config.json tool/prebuilt_manifest.dart artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release
          path: artifacts/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/native-')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^native-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          read -r manifest_pin _ < artifacts/manifest.sha256
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Native libraries built from $GITHUB_SHA. Use the matching package revision.

          Add to your app's root pubspec.yaml:

              hooks:
                user_defines:
                  tor_ffi_plugin:
                    native_build: prebuilt
                    prebuilt_manifest_url: "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json"
                    prebuilt_manifest_sha256: "$manifest_pin"

          See README.md for supported platforms and deployment minimums.
          EOF
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --latest=false \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
